<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RideTrace | GPX 라이딩 기록</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#eaf5fa;background:#07141d}*{box-sizing:border-box}body{margin:0}header{padding:18px 22px;border-bottom:1px solid #24404b;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}h1{font-size:23px;margin:0}small{color:#91b1bc}.wrap{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:calc(100vh - 80px)}aside{padding:18px;background:#0d202a;border-right:1px solid #25404b;display:flex;flex-direction:column;gap:13px}label{font-size:13px;color:#b7d2da}input,button,select{accent-color:#4ce1bb}button,.file{border:1px solid #385765;background:#193745;color:#fff;padding:11px;border-radius:10px;cursor:pointer;font-size:14px}button:hover{background:#275365}.file{display:block;text-align:center}.file input{display:none}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.control{display:flex;flex-direction:column;gap:6px}input[type=range]{width:100%}main{min-width:0;display:flex;flex-direction:column}canvas{display:block;width:100%;touch-action:none}#map{height:min(66vh,700px);background:#0b2835}#elevation{height:130px;background:#0b1d29;border-top:1px solid #244452}.status{padding:10px 16px;font-size:13px;color:#b4d4dc;line-height:1.5}.stats{display:flex;flex-wrap:wrap;gap:8px}.stat{background:#14303d;border-radius:8px;padding:9px;font-size:13px}.note{color:#8aadb9;font-size:12px;line-height:1.5}@media(max-width:760px){.wrap{display:flex;flex-direction:column}aside{border-right:0;border-bottom:1px solid #25404b}#map{height:49vh}}
</style></head><body>
<header><h1>🚴 RideTrace <small>Every ride leaves a trace.</small></h1><small>GPX · 2D / 3D · 고도 · 재생</small></header>
<div class="wrap"><aside>
<label class="file">📂 GPX 파일 선택 (여러 개 가능)<input id="file" type="file" accept=".gpx,application/gpx+xml,application/xml,text/xml" multiple></label>
<div class="pair"><button id="mode">3D 고도 보기</button><button id="reset">시점 초기화</button></div>
<div class="control"><label>🧭 지도 회전 (방위각) <output id="bearingOut">0°</output></label><input id="bearing" type="range" min="-180" max="180" value="0"></div>
<div class="control"><label>📷 카메라 회전 (측면 기울기) <output id="cameraOut">55°</output></label><input id="camera" type="range" min="0" max="90" value="55"></div>
<div class="pair"><button id="top">⬇ 위에서 보기</button><button id="side">⛰ 측면 보기</button></div>
<div class="control"><label>⛰ 고도 강조 <output id="scaleOut">20×</output></label><input id="scale" type="range" min="1" max="100" value="20"></div>
<div class="pair"><button id="play">▶ 재생</button><button id="stop">■ 정지</button></div>
<div class="control"><label>이동 진행률 <output id="progressOut">0%</output></label><input id="progress" type="range" min="0" max="1000" value="0"></div>
<div class="control"><label>재생 속도 <output id="speedOut">1×</output></label><input id="speed" type="range" min="1" max="20" value="1"></div>
<div id="stats" class="stats"></div>
<div class="note">GPX 파일은 이 브라우저에서만 읽습니다. 실제 산 지형이 아니라 GPX 고도값을 입체적으로 표시합니다. 고도 데이터가 없는 파일은 높이를 표현할 수 없습니다.</div>
</aside><main><canvas id="map"></canvas><canvas id="elevation"></canvas><div id="status" class="status">GPX 파일을 선택하면 라이딩 경로와 고도 변화를 표시합니다. 지도 회전과 카메라 회전을 따로 조절할 수 있습니다.</div></main></div>
<script>
'use strict';
const $=id=>document.getElementById(id),cv=$('map'),ec=$('elevation'),ctx=cv.getContext('2d'),ex=ec.getContext('2d');
let tracks=[],points=[],cum=[],dist=0,three=false,playing=false,progress=0,frame=0,last=0,panX=0,panY=0,zoom=1,drag=null;
const rad=Math.PI/180;
function hav(a,b){const p=(b.lat-a.lat)*rad,q=(b.lon-a.lon)*rad,s=Math.sin(p/2)**2+Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(q/2)**2;return 12742000*Math.asin(Math.min(1,Math.sqrt(s)))}
function parse(xml){const doc=new DOMParser().parseFromString(xml,'application/xml');if(doc.querySelector('parsererror'))throw Error('GPX XML 형식이 올바르지 않습니다.');const groups=[...doc.getElementsByTagName('trkseg')];if(!groups.length)groups.push(...doc.getElementsByTagName('rte'));if(!groups.length)groups.push(doc);return groups.map(g=>[...g.getElementsByTagName('trkpt'),...g.getElementsByTagName('rtept')].map(n=>{const e=n.getElementsByTagName('ele')[0];return {lat:+n.getAttribute('lat'),lon:+n.getAttribute('lon'),ele:e?+e.textContent:null}}).filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lon))).filter(a=>a.length>1)}
function smooth(a){return a.map((p,i)=>{if(p.ele===null)return {...p,h:null};const vals=a.slice(Math.max(0,i-6),Math.min(a.length,i+7)).map(x=>x.ele).filter(Number.isFinite).sort((x,y)=>x-y);return {...p,h:vals.length?vals[Math.floor(vals.length/2)]:null}})}
function rebuild(){points=tracks.flatMap(a=>a);cum=[];dist=0;for(let a of tracks){let prev=null;for(let p of a){if(prev)dist+=hav(prev,p);cum.push(dist);prev=p}}$('stats').innerHTML='<span class="stat">경로 '+tracks.length+'개</span><span class="stat">거리 '+(dist/1000).toFixed(1)+' km</span><span class="stat">포인트 '+points.length.toLocaleString()+'개</span>';$('status').textContent=points.length?'경로를 불러왔습니다. 3D 버튼과 카메라 회전으로 높낮이를 확인하세요.':'GPX 파일을 선택하세요.';draw()}
function resize(c){const d=devicePixelRatio||1,w=Math.max(1,Math.round(c.clientWidth*d)),h=Math.max(1,Math.round(c.clientHeight*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h}return [w,h,d]}
function projectMaker(w,h){const b=points.length?points:[{lat:33,lon:124,h:0},{lat:39,lon:131,h:0}];let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;const lat0=b.reduce((s,p)=>s+p.lat,0)/b.length,lon0=b.reduce((s,p)=>s+p.lon,0)/b.length;const c=Math.cos(lat0*rad),angle=+$('bearing').value*rad,tilt=three?+$('camera').value*rad:Math.PI/2,scale=+$('scale').value;const convert=p=>{const x=(p.lon-lon0)*111000*c,y=(p.lat-lat0)*111000;const xx=x*Math.cos(angle)-y*Math.sin(angle),yy=x*Math.sin(angle)+y*Math.cos(angle);const z=three?(p.h??0)*scale:0;return [xx,yy*Math.sin(tilt)-z*Math.cos(tilt)]};for(let p of b){const [x,y]=convert(p);minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y)}const spanX=Math.max(100,maxX-minX),spanY=Math.max(100,maxY-minY),s=Math.min(w*.85/spanX,h*.80/spanY)*zoom,ox=w/2-(minX+maxX)/2*s+panX,oy=h/2+(minY+maxY)/2*s+panY;return p=>{const [x,y]=convert(p);return [ox+x*s,oy-y*s]}}
function draw(){const [w,h,d]=resize(cv);ctx.fillStyle='#0b2835';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#224656';ctx.lineWidth=d;for(let i=0;i<=10;i++){ctx.beginPath();ctx.moveTo(i*w/10,0);ctx.lineTo(i*w/10,h);ctx.moveTo(0,i*h/10);ctx.lineTo(w,i*h/10);ctx.stroke()}if(!points.length){ctx.fillStyle='#8fb7c4';ctx.textAlign='center';ctx.font=(17*d)+'px system-ui';ctx.fillText('GPX 파일을 선택하세요',w/2,h/2);drawElevation();return}const project=projectMaker(w,h);for(let k=0;k<tracks.length;k++){const a=tracks[k];ctx.beginPath();a.forEach((p,i)=>{const [x,y]=project(p);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.strokeStyle=['#42e2c0','#ffca6d','#81adff','#fc8cab'][k%4];ctx.lineWidth=2.5*d;ctx.lineJoin='round';ctx.stroke()}const idx=Math.min(points.length-1,Math.round(progress*(points.length-1)));const [x,y]=project(points[idx]);ctx.beginPath();ctx.arc(x,y,6*d,0,2*Math.PI);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#0e1620';ctx.lineWidth=2*d;ctx.stroke();drawElevation()}
function drawElevation(){const [w,h,d]=resize(ec);ex.fillStyle='#0b1d29';ex.fillRect(0,0,w,h);const a=points.filter(p=>p.h!==null);if(a.length<2){ex.fillStyle='#90acb6';ex.font=(12*d)+'px system-ui';ex.fillText('고도 데이터가 포함된 GPX를 불러오세요',12*d,25*d);return}const vals=a.map(p=>p.h),mn=Math.min(...vals),mx=Math.max(...vals),span=Math.max(1,mx-mn);ex.beginPath();a.forEach((p,i)=>{const x=12*d+i/(a.length-1)*(w-24*d),y=h-18*d-(p.h-mn)/span*(h-38*d);i?ex.lineTo(x,y):ex.moveTo(x,y)});ex.strokeStyle='#42e2c0';ex.lineWidth=2*d;ex.stroke();ex.fillStyle='#c7e1e8';ex.font=(11*d)+'px system-ui';ex.fillText('최저 '+Math.round(mn)+'m / 최고 '+Math.round(mx)+'m',12*d,14*d);ex.fillStyle='#ffca6d';ex.fillRect(12*d+progress*(w-24*d),0,2*d,h)}
$('file').addEventListener('change',async e=>{playing=false;$('play').textContent='▶ 재생';tracks=[];let errors=[];for(let f of e.target.files){try{const xml=await f.text();tracks.push(...parse(xml).map(smooth))}catch(err){errors.push(f.name+': '+err.message)}}progress=0;$('progress').value=0;zoom=1;panX=panY=0;rebuild();if(errors.length)$('status').textContent=errors.join(' / ')});
$('mode').onclick=()=>{three=!three;$('mode').textContent=three?'2D 평면 보기':'3D 고도 보기';draw()};
for(let id of ['bearing','camera','scale','speed'])$(id).oninput=()=>{$(id==='bearing'?'bearingOut':id==='camera'?'cameraOut':id==='scale'?'scaleOut':'speedOut').textContent=$(id).value+(id==='bearing'||id==='camera'?'°':'×');draw()};
$('top').onclick=()=>{three=true;$('mode').textContent='2D 평면 보기';$('camera').value=90;$('cameraOut').textContent='90°';draw()};
$('side').onclick=()=>{three=true;$('mode').textContent='2D 평면 보기';$('camera').value=12;$('cameraOut').textContent='12°';draw()};
$('reset').onclick=()=>{panX=panY=0;zoom=1;$('bearing').value=0;$('camera').value=55;$('bearingOut').textContent='0°';$('cameraOut').textContent='55°';draw()};
$('progress').oninput=e=>{progress=+e.target.value/1000;$('progressOut').textContent=Math.round(progress*100)+'%';draw()};
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Ⅱ 일시정지':'▶ 재생';last=0;if(playing)requestAnimationFrame(tick)};
$('stop').onclick=()=>{playing=false;progress=0;$('play').textContent='▶ 재생';$('progress').value=0;$('progressOut').textContent='0%';draw()};
function tick(t){if(!playing)return;if(last)progress=Math.min(1,progress+(t-last)/1000*(+$('speed').value)/100);last=t;$('progress').value=Math.round(progress*1000);$('progressOut').textContent=Math.round(progress*100)+'%';draw();if(progress>=1){playing=false;$('play').textContent='▶ 재생';last=0}else requestAnimationFrame(tick)}
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;panX+=(e.clientX-drag.x)*(devicePixelRatio||1);panY+=(e.clientY-drag.y)*(devicePixelRatio||1);drag={x:e.clientX,y:e.clientY};draw()});
cv.addEventListener('pointerup',()=>drag=null);cv.addEventListener('pointercancel',()=>drag=null);
cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.4,Math.min(12,zoom*(e.deltaY>0?.9:1.1)));draw()},{passive:false});
window.addEventListener('resize',draw);draw();
</script></body></html>
